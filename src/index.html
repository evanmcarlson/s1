<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SHAPE REALITY STICKERS</title>
  <meta itemprop="name" content="SHAPE REALITY STICKERS">
  <meta name="twitter:title" content="SHAPE REALITY STICKERS">
  <meta property="og:title" content="SHAPE REALITY STICKERS">
  <meta property="og:site_name" content="SHAPE REALITY STICKERS">
  <meta name="description" content="Shape Reality AR Stickers (S1)">
  <meta itemprop="description" content="Shape Reality AR Stickers (S1)">
  <meta property="og:description" content="Shape Reality AR Stickers (S1)">
  <meta name="twitter:description" content="Shape Reality AR Stickers (S1)">
  <meta property="og:image" content="https://evanmcarlson.github.io/s1/assets/demo.png">

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  </script>

<meta name="apple-mobile-web-app-capable" content="yes"/>
<script src="https://unpkg.com/aframe-hologram-shader"></script>

</head>

<body>
<script src="bundle.js"></script>

<a-scene
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement:true"
  xrconfig
  xrweb
  landing-page="backgroundColor: #000;"
>
  <a-assets>
    <img id="img" src="./assets/transparent.png" />
    <img id="words" src="./assets/words.png" />
    <img id="logo" src="./assets/logo.png" />
    <img id="sticker1" src="./assets/sticker1-animated2.png" />
    <video id="qrReveal" src="./assets/qr-trimmed.mp4" muted autoplay loop></video>
  </a-assets>

  <a-camera
    position="0 4 10"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;"
  >
  </a-camera>

  <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

  <a-light type="ambient" intensity="0.7"></a-light>

  <!-- ctrl sticker -->
  <xrextras-named-image-target name="sticker1">
    <!-- <a-circle color="black" radius="0.5"></a-circle> -->
    <!-- <a-plane
      src="#words"
      material="transparent: true"
      position="0 0 0.001"
      animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; loop: true; easing: linear; dur: 10000"
    ></a-plane> -->
    <a-plane
      src="#logo"
      material="transparent: true; shader: hologram; numGlitchBars: 20"
      position="0 0 0.002"
    ></a-plane>
    <a-plane
      src="#sticker1"
      material="transparent: true; shader: hologram; numGlitchBars: 20"
      position="0 0 0.002"
    ></a-plane>
    </a-entity>
  </xrextras-named-image-target>

  <!-- qr code sticker -->
  <xrextras-named-image-target name="sticker2">
    <!-- <a-plane src="#qrReveal"></a-plane> -->
    <a-plane color-match-plane></a-plane>
    <a-plane chromakey-video="src: #qrReveal; color: #ffffff; similarity: 0.2; smoothness: 0.2; spill: 0; lumaKey: true; matchBlack: true;" position="0 0 0.001"></a-plane>
  </xrextras-named-image-target>
</a-scene>

</body>

</html>
