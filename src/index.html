<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>A-Frame: Image Target Stickers</title>
  <meta itemprop="name" content="A-Frame: Image Target Stickers">
  <meta name="twitter:title" content="A-Frame: Image Target Stickers">
  <meta property="og:title" content="A-Frame: Image Target Stickers">
  <meta property="og:site_name" content="A-Frame: Image Target Stickers">
  <meta name="description" content="I made AR stickers for my friends&#x27; birthday. Happy birthday Chanel &amp; Diana!">
  <meta itemprop="description" content="I made AR stickers for my friends&#x27; birthday. Happy birthday Chanel &amp; Diana!">
  <meta property="og:description" content="I made AR stickers for my friends&#x27; birthday. Happy birthday Chanel &amp; Diana!">
  <meta name="twitter:description" content="I made AR stickers for my friends&#x27; birthday. Happy birthday Chanel &amp; Diana!">
  <meta property="og:image" content="https://evanmcarlson.github.io/s1/assets/demo.png">

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  </script>

<meta name="apple-mobile-web-app-capable" content="yes"/>
<script src="https://unpkg.com/aframe-hologram-shader"></script>

</head>

<body>
<script src="bundle.js"></script>

<a-scene
  xrextras-gesture-detector
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement:true"
  xrconfig
  xrweb
  landing-page
>
  <a-assets>
    <img id="img" src="./assets/transparent.png" />
  </a-assets>

  <a-camera
    position="0 4 10"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;"
  >
  </a-camera>

  <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

  <a-light type="ambient" intensity="0.7"></a-light>

  <!-- Note: "name:" must be set to the name of the image target uploaded to the 8th Wall Console -->
  <xrextras-named-image-target name="image">
    <!-- Add a child entity of the image target. -->
    <a-circle color="black" radius="0.46"></a-circle>
    <a-plane
      src="#img"
      material="transparent: true; shader: hologram; numGlitchBars: 20"
      position="0 0 0.5"
      animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; loop: true; easing: linear; dur: 10000"
    ></a-plane>
  </xrextras-named-image-target>
</a-scene>

</body>

</html>
